version: 2
updates:
  - package-ecosystem: pip
    directories:
      - /services/api
      - /services/listener
      - /services/processor
      - /shared/python
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: bun
    directory: /services/frontend
    schedule:
      interval: weekly
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories:
      - /services/api
      - /services/listener
      - /services/processor
      - /services/frontend
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
