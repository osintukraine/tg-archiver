# tg-archiver - Telegram Archiving Platform 
# Simple, self-hosted Telegram channel archiver with frontend

services:
  # ==========================================================================
  # INFRASTRUCTURE
  # ==========================================================================

  postgres:
    image: postgres:18.6-alpine
    container_name: tg-archiver-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-archiver}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-tg_archiver}
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/docker
      - postgres18_data:/var/lib/postgresql
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # ports:
    #   - "5432:5432"  # Uncomment for local development only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-archiver} -d ${POSTGRES_DB:-tg_archiver}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot: applies pending infrastructure/postgres/migrations/*.sql (init.sql
  # only runs on an empty volume). Services wait for it to finish successfully.
  db-migrate:
    image: postgres:18.6-alpine
    container_name: tg-archiver-db-migrate
    entrypoint: ["/bin/sh", "/migrate.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-archiver}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      PGDATABASE: ${POSTGRES_DB:-tg_archiver}
    volumes:
      - ./infrastructure/postgres/migrate.sh:/migrate.sh:ro
      - ./infrastructure/postgres/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:8-alpine
    container_name: tg-archiver-redis
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    # ports:
    #   - "6379:6379"  # Uncomment for local development only
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a ${REDIS_PASSWORD}} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # S3-compatible object storage (SeaweedFS replaces the archived MinIO).
  # Credentials and bucket come from the MINIO_* variables the services use.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: tg-archiver-seaweedfs
    entrypoint: ["/bin/sh", "/etc/seaweedfs/entrypoint.sh"]
    environment:
      S3_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      S3_PUBLIC_BUCKET: ${MINIO_BUCKET:-tg-archive-media}
    volumes:
      - seaweedfs_data:/data
      - ./infrastructure/seaweedfs/entrypoint.sh:/etc/seaweedfs/entrypoint.sh:ro
    # ports:
    #   - "8333:8333"      # S3 API - Uncomment for local development only
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # ==========================================================================
  # APPLICATION SERVICES
  # ==========================================================================

  listener:
    build:
      context: .
      dockerfile: services/listener/Dockerfile
    container_name: tg-archiver-listener
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_SESSION_NAME=${TELEGRAM_SESSION_NAME:-listener}
      - TELEGRAM_SESSION_PATH=/data/sessions
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-archiver}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me_in_production}
      - POSTGRES_DB=${POSTGRES_DB:-tg_archiver}
      - MINIO_ENDPOINT=seaweedfs:8333
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_SECURE=false
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change_me_in_production}
      - FOLDER_ARCHIVE_ALL_PATTERN=${FOLDER_ARCHIVE_ALL_PATTERN:-Archive}
      # Backfill configuration
      - BACKFILL_ENABLED=${BACKFILL_ENABLED:-false}
      - BACKFILL_START_DATE=${BACKFILL_START_DATE:-2024-01-01}
      - BACKFILL_MODE=${BACKFILL_MODE:-manual}
      - BACKFILL_BATCH_SIZE=${BACKFILL_BATCH_SIZE:-100}
      - BACKFILL_DELAY_MS=${BACKFILL_DELAY_MS:-1000}
      - BACKFILL_MEDIA_STRATEGY=${BACKFILL_MEDIA_STRATEGY:-download_available}
      # Gap detection
      - GAP_DETECTION_ENABLED=${GAP_DETECTION_ENABLED:-false}
      - GAP_LOOKBACK_HOURS=${GAP_LOOKBACK_HOURS:-24}
      # Discovered-channel joining (approval = admin must approve each channel)
      - CHANNEL_JOIN_MODE=${CHANNEL_JOIN_MODE:-approval}
      - CHANNEL_JOIN_ENABLED=${CHANNEL_JOIN_ENABLED:-true}
      - CHANNEL_JOIN_INTERVAL_SECONDS=${CHANNEL_JOIN_INTERVAL_SECONDS:-60}
      - CHANNEL_JOIN_BATCH_SIZE=${CHANNEL_JOIN_BATCH_SIZE:-5}
      - CHANNEL_JOIN_MAX_RETRIES=${CHANNEL_JOIN_MAX_RETRIES:-3}
      - CHANNEL_JOIN_RETRY_DELAY_HOURS=${CHANNEL_JOIN_RETRY_DELAY_HOURS:-24}
      - CHANNEL_JOIN_DAILY_CAP=${CHANNEL_JOIN_DAILY_CAP:-20}
      - CHANNEL_JOIN_LIMIT_PAUSE_HOURS=${CHANNEL_JOIN_LIMIT_PAUSE_HOURS:-24}
      # Social data fetching
      - SOCIAL_FETCH_ENABLED=${SOCIAL_FETCH_ENABLED:-true}
      - SOCIAL_FETCH_PERIOD_DAYS=${SOCIAL_FETCH_PERIOD_DAYS:-7}
      - SOCIAL_FETCH_INTERVAL_SECONDS=${SOCIAL_FETCH_INTERVAL_SECONDS:-300}
      - SOCIAL_FETCH_BATCH_SIZE=${SOCIAL_FETCH_BATCH_SIZE:-50}
      - SOCIAL_REACTION_POLL_INTERVAL=${SOCIAL_REACTION_POLL_INTERVAL:-30}
    volumes:
      - ./sessions:/data/sessions
      - ${MEDIA_BUFFER_PATH:-./data/media-buffer}:/var/cache/media-buffer
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  processor:
    build:
      context: .
      dockerfile: services/processor/Dockerfile
    container_name: tg-archiver-processor
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_SESSION_PATH=/data/sessions
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-archiver}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me_in_production}
      - POSTGRES_DB=${POSTGRES_DB:-tg_archiver}
      - MINIO_ENDPOINT=seaweedfs:8333
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET:-tg-archive-media}
      - MINIO_SECURE=false
      - MEDIA_BUFFER_PATH=/var/cache/media-buffer
      # Failed messages are retried after this idle time (3 attempts, then DLQ)
      - PROCESSOR_RETRY_IDLE_MS=${PROCESSOR_RETRY_IDLE_MS:-300000}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change_me_in_production}
      - TRANSLATION_ENABLED=${TRANSLATION_ENABLED:-false}
      - DEEPL_API_KEY=${DEEPL_API_KEY:-}
    volumes:
      - ./sessions:/data/sessions
      - ${MEDIA_BUFFER_PATH:-./data/media-buffer}:/var/cache/media-buffer
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      listener:
        condition: service_started
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: tg-archiver-api
    environment:
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-archiver}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me_in_production}
      - POSTGRES_DB=${POSTGRES_DB:-tg_archiver}
      - MINIO_ENDPOINT=seaweedfs:8333
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET:-tg-archive-media}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-http://localhost:9000}
      - MINIO_SECURE=false
      - SECRET_KEY=${SECRET_KEY:-change_me_in_production}
      # Authentication
      - AUTH_PROVIDER=${AUTH_PROVIDER:-jwt}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change_me_in_production}
      - JWT_ADMIN_EMAIL=${JWT_ADMIN_EMAIL:-admin@tg-archiver.local}
      - JWT_ADMIN_PASSWORD=${JWT_ADMIN_PASSWORD:-change_me_in_production}
      - JWT_EXPIRATION_MINUTES=${JWT_EXPIRATION_MINUTES:-60}
      # Security (read by auth router, CSRF middleware and token blacklist)
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - CSRF_ENABLED=${CSRF_ENABLED:-true}
      - TOKEN_BLACKLIST_FAIL_MODE=${TOKEN_BLACKLIST_FAIL_MODE:-open}
      # Cloudflare Turnstile secret for POST /api/channel-submissions (unset = captcha not verified)
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      # Backfill (for API to know if it's enabled)
      - BACKFILL_ENABLED=${BACKFILL_ENABLED:-false}
      - BACKFILL_START_DATE=${BACKFILL_START_DATE:-2024-01-01}
      # Reported in the admin Discovered tab
      - CHANNEL_JOIN_MODE=${CHANNEL_JOIN_MODE:-approval}
      - CHANNEL_JOIN_ENABLED=${CHANNEL_JOIN_ENABLED:-true}
    # ports:
    #   - "8000:8000"  # Uncomment for local development only
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
      args:
        # When using Caddy, all routes go through localhost:80
        # API: /api/* -> api:8000, Media: /media/* -> seaweedfs, Frontend: /* -> frontend
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_MINIO_URL: ${NEXT_PUBLIC_MINIO_URL:-}
        NEXT_PUBLIC_TRANSLATION_ENABLED: ${TRANSLATION_ENABLED:-true}
        NEXT_PUBLIC_RSS_ENABLED: ${NEXT_PUBLIC_RSS_ENABLED:-false}
        # Empty = Cloudflare's always-pass test key (suggest-channel captcha is then a no-op)
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    container_name: tg-archiver-frontend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
      - NEXT_PUBLIC_MINIO_URL=${NEXT_PUBLIC_MINIO_URL:-}
      - NEXT_PUBLIC_TRANSLATION_ENABLED=${TRANSLATION_ENABLED:-true}
      - NEXT_PUBLIC_RSS_ENABLED=${NEXT_PUBLIC_RSS_ENABLED:-false}
    # ports:
    #   - "3000:3000"  # Uncomment for local development only
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================================================
  # REVERSE PROXY - Caddy
  # ==========================================================================
  # Single entry point: http://localhost
  # Routes: /api/* -> api, /media/* -> seaweedfs, /* -> frontend

  caddy:
    image: caddy:2-alpine
    container_name: tg-archiver-caddy
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - frontend
      - seaweedfs
    restart: unless-stopped

volumes:
  postgres18_data:
  redis_data:
  seaweedfs_data:

# To run:
# 1. Copy .env.example to .env and fill in Telegram credentials
# 2. docker-compose up -d
# 3. Access frontend at http://localhost wit Caddy
# 4. Access frontend at http://localhost:3000
# 5. Access API at http://localhost:8000
# 6. S3 API at http://localhost:8333 (uncomment the seaweedfs port first)
