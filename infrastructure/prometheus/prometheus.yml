global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

# Job names are used by the api (/api/metrics/services queries up{job="..."}); keep them.
scrape_configs:
  - job_name: listener
    static_configs:
      - targets: ["listener:8001"]
  - job_name: processor
    static_configs:
      - targets: ["processor:8002"]
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
