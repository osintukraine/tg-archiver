[tool.ruff]
target-version = "py314"
# Existing code goes up to ~177 cols (33 lines > 120, 225 > 100); 120 fits nearly all. E501 is not selected.
line-length = 120
extend-exclude = ["services/frontend"]

[tool.ruff.lint]
# F pyflakes, E4/E7/E9 import/statement/syntax errors, B bugbear, S bandit
select = ["E4", "E7", "E9", "F", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]  # pytest asserts
# Logging is configured (setup_logging) before the app modules are imported, so their import-time logs are structured.
"services/api/src/main.py" = ["E402"]
# SQLAlchemy relationship("Name") / Mapped["Name"] forward references are string annotations
# resolved at mapper configuration time; pyflakes cannot see the imports.
"shared/python/models/*.py" = ["F821"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI parameter defaults are idiomatic, not mutable-default bugs.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Path",
    "fastapi.Header", "fastapi.Security", "fastapi.File", "fastapi.Form", "fastapi.Cookie",
]
